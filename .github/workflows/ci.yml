name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  FOUNDRYWEBUI_NO_BROWSER: '1'

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer needs full history.

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (app)
        run: dotnet restore FoundryWebUI-X.csproj

      - name: Restore (unit tests)
        run: dotnet restore tests/FoundryWebUI-X.UnitTests/FoundryWebUI-X.UnitTests.csproj

      - name: Restore (integration tests)
        run: dotnet restore tests/FoundryWebUI-X.IntegrationTests/FoundryWebUI-X.IntegrationTests.csproj

      - name: Restore (e2e tests)
        run: dotnet restore tests/FoundryWebUI-X.E2ETests/FoundryWebUI-X.E2ETests.csproj

      - name: Format check
        run: |
          dotnet format FoundryWebUI-X.csproj --verify-no-changes --no-restore
          dotnet format tests/FoundryWebUI-X.UnitTests/FoundryWebUI-X.UnitTests.csproj --verify-no-changes --no-restore
          dotnet format tests/FoundryWebUI-X.IntegrationTests/FoundryWebUI-X.IntegrationTests.csproj --verify-no-changes --no-restore
          dotnet format tests/FoundryWebUI-X.E2ETests/FoundryWebUI-X.E2ETests.csproj --verify-no-changes --no-restore

      - name: Build (Release)
        run: |
          dotnet build FoundryWebUI-X.csproj -c Release --no-restore
          dotnet build tests/FoundryWebUI-X.UnitTests/FoundryWebUI-X.UnitTests.csproj -c Release --no-restore
          dotnet build tests/FoundryWebUI-X.IntegrationTests/FoundryWebUI-X.IntegrationTests.csproj -c Release --no-restore
          dotnet build tests/FoundryWebUI-X.E2ETests/FoundryWebUI-X.E2ETests.csproj -c Release --no-restore

      - name: Install Playwright browsers (chromium)
        shell: pwsh
        run: |
          $script = Get-ChildItem -Recurse `
              -Path tests/FoundryWebUI-X.E2ETests/bin/Release `
              -Filter playwright.ps1 | Select-Object -First 1
          if (-not $script) { throw "playwright.ps1 not found" }
          & $script.FullName install chromium --with-deps

      - name: Run unit tests
        run: dotnet run --project tests/FoundryWebUI-X.UnitTests/FoundryWebUI-X.UnitTests.csproj -c Release --no-build

      - name: Run integration tests
        run: dotnet run --project tests/FoundryWebUI-X.IntegrationTests/FoundryWebUI-X.IntegrationTests.csproj -c Release --no-build

      - name: Run E2E tests
        run: dotnet run --project tests/FoundryWebUI-X.E2ETests/FoundryWebUI-X.E2ETests.csproj -c Release --no-build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/TestResults/*.html
          if-no-files-found: ignore
